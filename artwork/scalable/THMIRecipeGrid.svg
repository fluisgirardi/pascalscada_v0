<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="48"
   height="48"
   viewBox="0 0 48 48"
   id="svg2"
   version="1.1"
   sodipodi:docname="THMIRecipeGrid.svg"
   inkscape:version="1.1">
  <defs id="defs4" />
  <sodipodi:namedview id="base" pagecolor="#ffffff" bordercolor="#666666" borderopacity="1.0" showgrid="false" />
  <metadata id="metadata7">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:title>THMIRecipeGrid</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>

  <!-- the table body -->
  <rect
     id="table"
     x="5" y="8" width="38" height="32" rx="1.5"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-linejoin:round;stroke-opacity:1" />
  <!-- the header band -->
  <rect
     id="header"
     x="5" y="8" width="38" height="7"
     style="fill:#c8c8c8;fill-opacity:1;stroke:none" />
  <line id="headerline" x1="5" y1="15" x2="43" y2="15"
        style="stroke:#000000;stroke-width:2;stroke-opacity:1" />
  <!-- the name column separator -->
  <line id="namecol" x1="17" y1="8" x2="17" y2="40"
        style="stroke:#000000;stroke-width:1.4;stroke-opacity:1" />
  <!-- the parameter column separators -->
  <line id="col2" x1="28" y1="15" x2="28" y2="40"
        style="stroke:#000000;stroke-width:1.1;stroke-opacity:1" />
  <line id="col3" x1="36" y1="15" x2="36" y2="40"
        style="stroke:#000000;stroke-width:1.1;stroke-opacity:1" />
  <!-- the recipe rows -->
  <line id="row1" x1="5" y1="22.5" x2="43" y2="22.5"
        style="stroke:#000000;stroke-width:1.1;stroke-opacity:1" />
  <line id="row2" x1="5" y1="30" x2="43" y2="30"
        style="stroke:#000000;stroke-width:1.1;stroke-opacity:1" />
  <!-- the selected row, tinted -->
  <rect
     id="selected"
     x="6.2" y="23.3" width="35.6" height="5.9"
     style="fill:#000064;fill-opacity:0.25;stroke:none" />
  <!-- the sequence numbers -->
  <text
     id="num1" x="9.6" y="21" style="font-size:7px;font-family:Verdana;font-weight:bold;fill:#000064;fill-opacity:1;stroke:none">1</text>
  <text
     id="num2" x="9.6" y="28.6" style="font-size:7px;font-family:Verdana;font-weight:bold;fill:#000064;fill-opacity:1;stroke:none">2</text>
  <text
     id="num3" x="9.6" y="36.4" style="font-size:7px;font-family:Verdana;font-weight:bold;fill:#000064;fill-opacity:1;stroke:none">3</text>
</svg>
