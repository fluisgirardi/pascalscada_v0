<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Component palette icon of TOPCUAServer: a server rack publishing (waves) with a UA badge, drawn with strokes (no font). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="48" height="48" viewBox="0 0 48 48" id="svg2">
  <title>TOPCUAServer</title>
  <g id="layer1">
    <!-- the rack -->
    <rect x="3" y="15" width="25" height="30" rx="2.5" fill="#4a4f57" stroke="#22252a" stroke-width="1.5"/>
    <rect x="6" y="19" width="19" height="7" rx="1" fill="#2c3036"/>
    <rect x="6" y="29" width="19" height="7" rx="1" fill="#2c3036"/>
