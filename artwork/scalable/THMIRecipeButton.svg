<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="48"
   height="48"
   viewBox="0 0 48 48"
   id="svg2"
   version="1.1"
   sodipodi:docname="THMIRecipeButton.svg"
   inkscape:version="1.1">
  <defs id="defs4" />
  <sodipodi:namedview id="base" pagecolor="#ffffff" bordercolor="#666666" borderopacity="1.0" showgrid="false" />
  <metadata id="metadata7">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:title>THMIRecipeButton</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>

  <!-- the raised button face -->
  <rect
     id="face"
     x="6" y="10" width="36" height="28" rx="4"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-linejoin:round;stroke-opacity:1" />
  <!-- the drop shadow of the pressed edge -->
  <line id="shadow" x1="10" y1="40.5" x2="38" y2="40.5"
        style="stroke:#a0a0a0;stroke-width:2;stroke-opacity:1" />
  <!-- the download arrow into the recipe row -->
  <line id="arrow" x1="24" y1="14.5" x2="24" y2="25.5"
        style="stroke:#000064;stroke-width:3;stroke-linecap:round;stroke-opacity:1" />
  <path
     id="arrowhead"
     d="M 17.5,21 L 24,28.5 L 30.5,21"
     style="fill:none;stroke:#000064;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:1" />
  <!-- the tray: the recipe row the values land on -->
  <line id="tray" x1="15" y1="33" x2="33" y2="33"
        style="stroke:#000000;stroke-width:2.4;stroke-linecap:round;stroke-opacity:1" />
  <line id="trayleg1" x1="15" y1="33" x2="15" y2="34.8"
        style="stroke:#000000;stroke-width:2;stroke-linecap:round;stroke-opacity:1" />
  <line id="trayleg2" x1="33" y1="33" x2="33" y2="34.8"
        style="stroke:#000000;stroke-width:2;stroke-linecap:round;stroke-opacity:1" />
</svg>
